<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavolo Empanadas · Don Salo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Merriweather:wght@700;900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F0DF;
    --ink: #191512;
    --ink-soft: #55504A;
    --accent: #C1502E;
    --accent-dark: #9C3E22;
    --success: #4F7942;
    --success-bg: #E4EDE0;
    --error: #B23A2E;
    --error-bg: #F6E3E0;
    --card-bg: #FFFFFF;
    --border: #E3DCCF;
    --radius: 14px;
    --radius-sm: 8px;
    --font-display: 'Poppins', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    /* Identidad Don Salo (Instagram) — por ahora solo para la pantalla de bienvenida */
    --font-serif: 'Merriweather', Georgia, serif;
    --font-spartan: 'League Spartan', system-ui, sans-serif;
    --brand-label: #634F50;
    /* Pantalla "¿Dónde entregamos?" (HK Grotesk no es libre; usamos Hanken Grotesk, su equivalente open-source) */
    --font-hk: 'Hanken Grotesk', system-ui, sans-serif;
    --screen1-text: #5E5A5C;
  }

  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width: 440px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background: var(--bg);
  }

  /* ---------- TOP BAR / STEP DOTS ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 18px 20px 6px 20px;
  }
  .topbar .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--border);
    transition: all .25s ease;
  }
  .topbar .dot.active{ background: var(--accent); width:22px; border-radius:5px; }
  .topbar .dot.done{ background: var(--accent-dark); }
  .topbar.hidden{ visibility:hidden; }

  .back-btn{
    position:absolute;
    top:16px; left:14px;
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background: rgba(255,255,255,0.6);
    color: var(--ink);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:5;
  }
  .back-btn.hidden{ display:none; }

  /* ---------- SCREENS ---------- */
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    padding: 10px 22px 100px 22px;
    animation: fadein .25s ease;
  }
  .screen.active{ display:flex; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  h1.title{
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    font-size: 26px;
    line-height:1.15;
    letter-spacing: -0.3px;
    margin: 6px 0 4px 0;
  }
  p.subtitle{
    font-size: 14px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.2px;
    margin: 0 0 18px 0;
  }
  label.field-label{
    display:block;
    font-size: 12px;
    font-weight:700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--ink-soft);
    margin: 14px 0 6px 0;
  }
  input[type=text], input[type=tel], select{
    width:100%;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    font-size: 15px;
    font-family: var(--font-body);
    text-transform: uppercase;
    color: var(--ink);
    outline: none;
  }
  input::placeholder{ text-transform:none; color:#B6AFA2; }
  input:focus, select:focus{ border-color: var(--accent); }
  .field-note{
    font-size: 10.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 6px 2px 0 2px;
    letter-spacing: 0.2px;
  }

  .suggestions-box{
    display:none;
    flex-direction:column;
    background:#fff;
    border: 1.5px solid var(--border);
    border-top:none;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    margin-top:-2px;
    overflow:hidden;
    max-height: 220px;
    overflow-y:auto;
  }
  .suggestions-box.show{ display:flex; }
  .hoy-chip{
    display:inline-block; background: var(--paper, #F6F1E8);
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 13px; font-weight: 600;
    margin-bottom: 18px; letter-spacing: .5px;
  }
  .sin-franjas{ display:none; }
  .sin-franjas.show{
    display:block; background:#FDF3E7; border:1.5px solid #E8C9A0;
    border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 4px;
  }
  .sf-tit{ font-size:14px; font-weight:700; margin-bottom:6px; }
  .sf-txt{ font-size:12px; line-height:1.6; text-transform:none; opacity:.85; }
  .suggestion-item{
    padding: 11px 14px;
    font-size: 13px;
    text-transform: none;
    border-bottom: 1px solid var(--border);
    cursor:pointer;
  }
  .suggestion-item:last-child{ border-bottom:none; }
  .suggestion-item:active, .suggestion-item.hover{ background: #F6F1E8; }
  .suggestion-empty, .suggestion-loading{
    padding: 11px 14px; font-size:12px; color: var(--ink-soft); text-transform:uppercase;
  }

  /* ---------- BUTTONS ---------- */
  .btn-fixed-wrap{
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex; justify-content:center;
    padding: 14px 22px 22px 22px;
    background: linear-gradient(to top, var(--bg) 60%, rgba(242,239,231,0));
    pointer-events:none;
  }
  .btn-fixed-wrap .inner{ width:100%; max-width:440px; pointer-events:auto; }
  .btn-primary{
    width:100%;
    padding: 16px;
    border-radius: 999px;
    border:none;
    background: var(--accent);
    color:#fff;
    font-family: var(--font-display);
    font-weight:700;
    text-transform:uppercase;
    font-size:15px;
    letter-spacing:0.3px;
    cursor:pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-primary:active{ transform: scale(0.98); }
  .btn-primary:disabled{ background:#D8CFC2; color:#fff; cursor:not-allowed; }
  .btn-secondary{
    width:100%;
    padding: 14px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: var(--font-display);
    font-weight:700;
    text-transform:uppercase;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
  }

  /* ---------- WELCOME SCREEN (identidad Don Salo) ---------- */
  .welcome-screen{ align-items:center; justify-content:center; text-align:center; padding-top:20px; }
  .brand-logo{
    width: 150px; height: auto;
    margin: 10px 0 14px 0;
  }
  .brand-title{
    font-family: var(--font-serif);
    font-weight: 900;
    color: var(--ink);
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.3px;
    margin-bottom: 40px;
  }
  .lang-columns{
    display:flex;
    width:100%;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 6px;
  }
  .lang-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
    padding: 10px;
    border-radius: var(--radius);
    transition: background .15s ease;
  }
  .lang-col:active{ background: rgba(99,79,80,0.08); }
  .lang-col-title{
    font-family: var(--font-spartan);
    font-weight:700;
    text-transform:uppercase;
    font-size: 19px;
    letter-spacing: 0.3px;
    color: var(--brand-label);
  }
  .lang-col-flag{ font-size: 38px; line-height:1; }
  .lang-col-sub{
    font-family: var(--font-spartan);
    font-weight:600;
    text-transform:uppercase;
    font-size: 11.5px;
    letter-spacing: 0.3px;
    color: var(--brand-label);
    line-height:1.3;
  }

  /* ---------- PANTALLA "¿DÓNDE ENTREGAMOS?" (identidad Don Salo) ---------- */
  /* Tipografía para todo el texto de esta pantalla + un único color de texto general.
     Los colores de estado (verde "perfecto", rojo "disculpá", badges 0/3) ya tienen su
     propio color explícito más abajo, así que no se ven afectados por esta regla. */
  #screen-1, #screen-1 *{
    font-family: var(--font-hk);
  }
  #screen-1{
    color: var(--screen1-text);
  }
  #screen-1 p.subtitle, #screen-1 label.field-label, #screen-1 input, #screen-1 select, #screen-1 .franja-opt{
    color: var(--screen1-text);
  }

  .radius-note{
    background: #EFE6D4;
    border: 1px solid #DCCFB2;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 11px;
    font-weight:600;
    color: var(--screen1-text);
    text-transform: none;
    line-height:1.4;
    margin: 10px 0 4px 0;
  }

  /* ---------- ZONE STATUS ---------- */
  .zone-msg{
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight:600;
    display:none;
  }
  .zone-msg.show{ display:block; }
  .zone-msg.ok{ background: var(--success-bg); color: var(--success); }
  .zone-msg.fail{ background: var(--error-bg); color: var(--error); }
  .zone-msg .wa-link{
    display:inline-block; margin-top:8px;
    color: var(--error); text-decoration: underline;
    font-weight:800; cursor:pointer;
  }

  /* ---------- FRANJAS ---------- */
  .franja-list{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .franja-opt{
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    font-size: 14px;
    font-weight:700;
    text-transform: uppercase;
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  .franja-opt.selected{ border-color: var(--accent); background:#FBEDE8; }
  .franja-opt.full{ opacity:0.4; cursor:not-allowed; text-decoration:line-through; }
  .franja-opt .badge{ font-size:10px; font-weight:800; background:#EDE6D8; color:var(--ink-soft); padding:2px 8px; border-radius:10px; }
  .franja-opt.full .badge{ background: var(--error); color:#fff; }
  .franja-opt.selected .badge{ background: var(--accent); color:#fff; }
  /* Cupo: "2/3 CONSEGNE DISPONIBILI" — el número es lo que queda libre, no lo ocupado */
  .franja-cupo{ display:flex; align-items:center; gap:8px; }
  /* Cartel de bienvenida con las reglas */
  .info-card{ margin: 22px auto 0; max-width: 440px; background:#fff; border:1.5px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px; text-align:left; font-family: var(--font-hk); }
  .info-tabs{ display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; }
  .info-tab{ font-size:10px; font-weight:800; padding:4px 10px; border-radius:999px; border:1.5px solid var(--border);
    background:transparent; color: var(--ink-soft); cursor:pointer; letter-spacing:1px; text-transform:uppercase; }
  .info-tab.on{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .info-tit{ font-size:13px; font-weight:800; letter-spacing:1.5px; color: var(--ink); text-transform:uppercase; margin-bottom:8px; }
  .info-ahora{ font-size:12px; font-weight:800; color: var(--accent-dark); background: var(--error-bg);
    border-radius: var(--radius-sm); padding:8px 10px; margin-bottom:10px; text-transform:uppercase; }
  .info-row{ display:flex; gap:10px; font-size:12px; line-height:1.45; color: var(--ink-soft); padding:5px 0;
    border-top:1px solid #F0EADF; text-transform:uppercase; }
  .info-ico{ flex:0 0 18px; text-align:center; }
  .info-row b{ color: var(--ink); }
  /* Aviso del día de entrega, arriba de la dirección */
  .aviso-dia{ font-size:12px; font-weight:800; line-height:1.4; border-radius: var(--radius-sm);
    padding: 10px 14px; margin: 0 0 14px; text-transform:uppercase; font-family: var(--font-hk); }
  .aviso-dia.hoy{ background: var(--success-bg); color: var(--success); }
  .aviso-dia.otro{ background: var(--error-bg); color: var(--accent-dark); }
  /* Pedido rechazado o cancelado */
  .pedido-anulado{ background: var(--error-bg); color: var(--error); border-radius: var(--radius);
    padding: 16px 18px; font-size:13px; font-weight:700; line-height:1.45; text-transform:uppercase; margin-top:16px; }
  .pedido-anulado a{ color: var(--error); }
  .franja-reserva{ font-size:11px; font-weight:700; color: var(--success); background: var(--success-bg);
    border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 4px; text-transform: uppercase; }
  .franja-opt.cargando{ opacity:0.55; pointer-events:none; }
  .franja-cupo-txt{ font-size:9.5px; font-weight:700; opacity:0.75; text-align:right; line-height:1.2; }

  /* ---------- COUNTER ---------- */
  .counter-box{
    display:flex; align-items:center; justify-content:center; gap:26px;
    margin: 30px 0 8px 0;
  }
  .counter-btn{
    width:52px; height:52px; border-radius:50%;
    border:2px solid var(--ink); background:#fff;
    font-size:26px; font-weight:800; color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .counter-num{
    font-family: var(--font-display);
    font-size: 48px; font-weight:800; min-width:70px; text-align:center;
  }
  .counter-hint{ text-align:center; font-size:12px; color: var(--ink-soft); text-transform:uppercase; }

  /* ---------- PANTALLA "¿CUÁNTAS EMPANADAS?" (misma identidad que pantalla 2) ---------- */
  #screen-2, #screen-2 *{ font-family: var(--font-hk); }
  #screen-2{ color: var(--screen1-text); }
  #screen-2 p.subtitle, #screen-2 .counter-hint, #screen-2 .flavor-group-title{ color: var(--screen1-text); }

  /* ---------- PANTALLA "TUS DATOS" (misma identidad) ---------- */
  #screen-3, #screen-3 *{ font-family: var(--font-hk); }
  #screen-3{ color: var(--screen1-text); }
  #screen-3 p.subtitle, #screen-3 label.field-label, #screen-3 input, #screen-3 select, #screen-3 .field-note{
    color: var(--screen1-text);
  }

  /* ---------- FLAVORS ---------- */
  .flavor-progress{
    display:flex; justify-content:space-between; align-items:center;
    background:#fff; border:1.5px solid var(--border); border-radius: var(--radius-sm);
    padding:10px 14px; margin-bottom:14px; font-weight:700; font-size:13px; text-transform:uppercase;
  }
  .flavor-progress .count.complete{ color: var(--success); }
  .flavor-group-title{
    font-size:13px; font-weight:800; text-transform:uppercase;
    margin: 18px 0 10px 0; letter-spacing:0.4px;
  }
  .flavor-row{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
    padding: 12px 4px; border-bottom: 1px solid var(--border);
  }
  .flavor-row.disabled{ opacity:0.4; }
  .flavor-text{ display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
  .flavor-name{ font-size:14px; font-weight:700; text-transform:uppercase; color:#1A5437; }
  .flavor-ingredients{
    font-size:10.5px; font-weight:500; text-transform:uppercase; color:#1A5437;
    opacity:0.85; line-height:1.3;
  }
  .flavor-ingredients.pending{ color: var(--error); opacity:1; font-weight:700; }
  .flavor-unavail{ font-size:10px; color: var(--error); font-weight:700; text-transform:uppercase; }
  .qty-stepper{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .qty-stepper button{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--ink);
    background:#fff; font-size:16px; font-weight:800; cursor:pointer;
  }
  .qty-stepper button:disabled{ opacity:0.3; cursor:not-allowed; }
  .qty-stepper .n{ min-width:16px; text-align:center; font-weight:800; font-size:14px; }
  .allergen-legend{
    font-size: 9.5px; color: var(--screen1-text); opacity:0.75;
    line-height:1.5; margin-top:16px; padding-top:12px;
    border-top: 1px solid var(--border);
  }

  /* ---------- SUMMARY ---------- */
  .privacy-box{
    margin-top: 14px;
    padding: 12px 14px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .privacy-text{
    font-size: 10.5px;
    color: var(--ink-soft);
    text-transform: none;
    line-height: 1.5;
    margin: 0 0 10px 0;
  }
  .privacy-check{
    display:flex; align-items:center; gap:8px;
    font-size: 11.5px; font-weight:700; text-transform:uppercase;
    cursor:pointer;
  }
  .privacy-check input{ width:16px; height:16px; flex-shrink:0; accent-color: var(--accent); }

  .summary-card{
    background:#fff; border:1.5px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom:14px;
  }
  .summary-line{
    display:flex; justify-content:space-between; font-size:12px; padding:5px 0;
    text-transform:uppercase;
  }
  .summary-line.total{
    font-weight:800; font-size:16px; border-top:1.5px solid var(--border);
    margin-top:10px; padding-top:12px;
    justify-content:flex-end; gap:10px;
    color: var(--ink);
  }
  .summary-line .muted{ color: var(--ink-soft); font-weight:400; }
  .summary-group-title{
    font-size:14px; font-weight:800; text-transform:uppercase;
    color:#1A5437; letter-spacing:0.2px;
    margin: 14px 0 5px 0;
  }
  .summary-line.envio{ margin-top:10px; }

  .phone-row{ display:flex; gap:8px; }
  .phone-row select{ flex: 0 0 92px; }
  .phone-row input{ flex:1; }

  .code-box{
    background: var(--ink); color:#fff; text-align:center;
    padding: 16px; border-radius: var(--radius); margin: 16px 0;
  }
  .code-box .lbl{ font-size:11px; text-transform:uppercase; opacity:0.7; letter-spacing:1px; }
  .code-row{ display:flex; align-items:center; justify-content:center; gap:12px; margin-top:4px; }
  .code-box .code{ font-family: var(--font-display); font-size:30px; font-weight:800; letter-spacing:2px; }
  .copy-btn{
    background: rgba(255,255,255,0.14);
    border: 1.5px solid rgba(255,255,255,0.4);
    color:#fff;
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font-display);
    font-weight:700;
    font-size: 11px;
    text-transform: uppercase;
    cursor:pointer;
    white-space:nowrap;
    transition: background .15s ease;
  }
  .copy-btn:active{ transform: scale(0.96); }
  .copy-btn.copied{ background: var(--success); border-color: var(--success); }

  /* Importe a pagar, repetido entre el código y los botones de pago */
  .pay-amount{
    text-align:center; margin: 0 0 6px 0;
    padding: 12px 14px; border-radius: var(--radius);
    background:#fff; border:1.5px solid var(--border);
  }
  .pay-amount .lbl{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:0.75; }
  .pay-amount .val{ font-size:32px; font-weight:800; color: var(--ink); line-height:1.15; margin-top:2px; }

  .timer-box{
    text-align:center; margin: 10px 0 16px 0;
    font-size:13px; color: var(--ink-soft); text-transform:uppercase;
  }
  .timer-box .time{ font-weight:800; color: var(--accent); font-size:15px; }

  .pay-option-btn{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1.5px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom:10px;
    text-decoration:none; cursor:pointer;
  }
  .pay-option-btn:active{ border-color: var(--accent); }
  .pay-option-name{
    font-family: var(--font-display); font-weight:800; font-size:15px; color: var(--ink);
  }
  .pay-option-note{
    font-size: 9.5px; font-weight:700; text-transform:uppercase; color: var(--ink-soft);
    text-align:right; max-width:130px; line-height:1.3;
  }
  .payment-reminder{
    background: #FBEDE8;
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-top: 14px;
    text-align:center;
    font-size: 11.5px;
    font-weight:700;
    color: var(--accent-dark);
    line-height:1.5;
  }
  .payment-reminder-btn{
    display:block;
    font-weight:900;
    margin-top:2px;
  }

  .expired-box{
    background: var(--error-bg);
    border: 2px solid var(--error);
    border-radius: var(--radius);
    padding: 24px 18px;
    text-align:center;
  }
  .expired-title{
    font-family: var(--font-display);
    font-weight:900;
    font-size: 24px;
    color: var(--error);
    text-transform:uppercase;
    margin-bottom:8px;
    letter-spacing:0.3px;
  }
  .expired-sub{
    font-size: 13px;
    color: var(--error);
    font-weight:600;
    margin-bottom:18px;
    line-height:1.4;
  }
  .expired-box .btn-primary{
    background: var(--error);
  }

  /* ---------- TRACKING ---------- */
  .track-wrap{ text-align:center; padding-top: 20px; }
  .track-steps{ display:flex; flex-direction:column; gap:0; margin: 26px 0; text-align:left; }
  .track-step{ display:flex; gap:14px; align-items:flex-start; position:relative; padding-bottom:34px; }
  .track-step:last-child{ padding-bottom:0; }
  .track-dot{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:2.5px solid var(--border); background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
    z-index:2;
    transition: background-color .35s ease, border-color .35s ease;
  }
  .track-step.done .track-dot, .track-step.current .track-dot{
    background: var(--success); border-color: var(--success); color:#fff;
  }
  .track-step:not(:last-child)::before{
    content:''; position:absolute; left:12px; top:26px; bottom:0; width:2px; background: var(--border);
    transition: background-color .35s ease;
  }
  .track-step.done:not(:last-child)::before{ background: var(--success); }

  /* ---------- LOS 6 PASOS DEL PEDIDO, dentro de la pantalla 3 (misma identidad) ---------- */
  #screen-3 .track-sub{ color: var(--screen1-text); }
  .track-label{ font-family: var(--font-display); font-weight:800; text-transform:uppercase; font-size:14px; margin-top:2px; }
  .track-sub{ font-size:12px; color: var(--ink-soft); margin-top:2px; }
  .step2-body{ width:100%; }
  .step2-body .track-label{ margin-bottom:10px; }
  #step-2{ padding-bottom: 40px; }
  #pagoExtras.hidden{ display:none; }

  .hidden{ display:none !important; }
</style>
</head>

<style>
/* ── TAVOLO EMPANADAS: estilos propios (sobre la base del delivery) ── */
.tv{ max-width:480px; margin:0 auto; padding:16px 18px 120px; font-family:var(--font-hk); color:var(--ink); }
.tv-cont{ position:sticky; top:0; z-index:20; margin:-16px -18px 14px; padding:10px 18px; background:var(--ink); color:#fff;
  font-size:12.5px; font-weight:800; letter-spacing:.5px; text-align:center; text-transform:uppercase; }
.tv-cont.ok{ background:var(--success); }
.tv-brand{ text-align:center; margin:6px 0 4px; }
.tv-brand img{ width:96px; height:auto; }
.tv-brand .t1{ font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:1px; }
.tv-brand .t2{ font-size:11px; letter-spacing:3px; color:var(--ink-soft); }
.tv h1{ font-family:var(--font-display); font-size:26px; line-height:1.15; margin:18px 0 6px; text-transform:uppercase; }
.tv .sub{ font-size:13px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:14px; }
.tv-card{ background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin:10px 0; }
.tv-row{ display:flex; gap:10px; font-size:13px; line-height:1.45; padding:6px 0; border-top:1px solid #F0EADF; text-transform:uppercase; }
.tv-row:first-child{ border-top:none; }
.tv-row b{ color:var(--ink); }
.tv-entrega{ background:var(--success-bg); color:var(--success); font-weight:800; font-size:13px; border-radius:var(--radius-sm); padding:10px 12px; text-transform:uppercase; }
.tv-cerrado{ background:var(--error-bg); color:var(--accent-dark); font-weight:800; font-size:13px; border-radius:var(--radius-sm); padding:10px 12px; text-transform:uppercase; margin-top:8px; }
.tv-grp{ font-size:12px; font-weight:800; letter-spacing:1.5px; color:var(--accent-dark); margin:18px 0 6px; text-transform:uppercase; }
.tv-item{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #F0EADF; }
.tv-item .nm{ flex:1; font-size:14px; font-weight:700; text-transform:uppercase; }
.tv-item .ing{ display:block; font-size:11px; font-weight:500; color:var(--ink-soft); margin-top:2px; }
.tv-item .pr{ font-size:13px; font-weight:700; color:var(--ink-soft); min-width:52px; text-align:right; }
.tv-step{ display:flex; align-items:center; gap:8px; }
.tv-step button{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--border); background:#fff; font-size:18px; font-weight:700; color:var(--ink); cursor:pointer; }
.tv-step button:disabled{ opacity:.35; }
.tv-step .n{ min-width:18px; text-align:center; font-weight:800; }
.tv-item.off{ opacity:.45; }
.tv-foto{ width:100%; max-width:260px; display:block; margin:6px auto 4px; border-radius:var(--radius); }
.tv-input{ width:100%; box-sizing:border-box; font:inherit; font-size:16px; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); margin:4px 0 10px; background:#fff; text-transform:uppercase; }
.tv-lbl{ font-size:11px; font-weight:800; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; }
.tv-err{ color:var(--error); font-size:12px; margin:-6px 0 8px; display:none; }
.tv-priv{ font-size:11.5px; color:var(--ink-soft); line-height:1.45; text-transform:uppercase; }
.tv-res{ font-size:13px; }
.tv-res div{ display:flex; justify-content:space-between; padding:3px 0; text-transform:uppercase; }
.tv-res .tot{ font-weight:800; font-size:16px; border-top:1.5px solid var(--border); margin-top:6px; padding-top:8px; }
.tv-code{ background:var(--ink); color:#fff; border-radius:var(--radius); padding:16px; text-align:center; }
.tv-code .l{ font-size:11px; letter-spacing:2px; opacity:.7; }
.tv-code .c{ font-family:var(--font-display); font-size:34px; font-weight:800; letter-spacing:2px; }
.tv-code button{ margin-top:6px; background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.5); border-radius:999px; padding:6px 14px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
.tv-amount{ text-align:center; margin:12px 0; }
.tv-amount .l{ font-size:11px; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; }
.tv-amount .v{ font-size:34px; font-weight:800; }
.tv-pay{ display:block; text-decoration:none; text-align:center; background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); padding:14px; margin:8px 0; color:var(--ink); font-weight:800; text-transform:uppercase; }
.tv-pay small{ display:block; font-weight:500; font-size:11px; color:var(--ink-soft); margin-top:3px; }
.tv-bar{ position:fixed; left:0; right:0; bottom:0; padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--bg); border-top:1px solid var(--border); }
.tv-bar .in{ max-width:480px; margin:0 auto; display:flex; gap:10px; align-items:center; }
.tv-bar .info{ flex:1; font-size:12px; font-weight:700; text-transform:uppercase; color:var(--ink-soft); }
.tv-btn{ border:none; border-radius:999px; padding:14px 22px; font:inherit; font-size:14px; font-weight:800; letter-spacing:.5px; background:var(--accent); color:#fff; cursor:pointer; text-transform:uppercase; }
.tv-btn.sec{ background:#fff; color:var(--ink); border:1.5px solid var(--border); }
.tv-btn:disabled{ background:#D8CDBF; cursor:not-allowed; }
.tv-hidden{ display:none !important; }
.tv-fatto{ text-align:center; }
.tv-fatto .big{ font-size:56px; }
.tv-legend{ font-size:10px; color:var(--ink-soft); line-height:1.5; margin-top:12px; text-transform:uppercase; }
</style>

function saborDisponible(s){
  if(!DISP) return true;
  const n = DISP[nombreInterno(s.key)];
  if(typeof n !== 'number') return true;
  return n > CONFIG.colchonStock;
}
const todosSabores = () => [
  ...SABORES.classiche.map(s=>({...s, tipo:'classica'})),
  ...SABORES.speciali.map(s=>({...s, tipo:'speciale'}))
];
function cuentas(){
  let nE=0, tot=0;
  todosSabores().forEach(s=>{ const q=st.emp[s.key]||0; nE+=q; tot+=q*CONFIG.precio[s.tipo]; });
  BIBITE.forEach(b=>{ tot+=(st.bib[b.key]||0)*b.prezzo; });
  DOLCI.forEach(d=>{ tot+=(st.dol[d.key]||0)*d.prezzo; });
  return { nE, tot: Math.round(tot*100)/100 };
}

// ── Contador de colegas (se escucha en vivo) ──
function pintarContador(){
  const el=document.getElementById('tvCont');
  const falta = Math.max(0, CONFIG.minimoColleghi - PAGATI);
  if(!EMPRESA){ el.textContent='TAVOLO EMPANADAS'; return; }
  if(falta===0){ el.className='tv-cont ok'; el.textContent=`✅ ${PAGATI} COLLEGHI A TAVOLA · CONSEGNA CONFERMATA!`; }
  else { el.className='tv-cont'; el.textContent=`🥟 ${PAGATI}/${CONFIG.minimoColleghi} COLLEGHI HANNO ORDINATO — NE ${falta===1?'MANCA 1':'MANCANO '+falta}!`; }
}
function escucharContador(){
  onSnapshot(doc(db,'tavolo_contador', SLUG+'_'+FECHA), sn=>{
    PAGATI = sn.exists() ? (sn.data().pagati||0) : 0;
    pintarContador();
  }, e=>console.error('contador',e));
}

  if(st.step===0){
    SCR.innerHTML = `
      <h1>OGGI È IL GIORNO DELLE EMPANADAS!</h1>
      <div class="tv-entrega">🛵 CONSEGNA PER <b>${EMPRESA.nombre}</b><br>${entrega}</div>
      ${esHoyCerrado() ? `<div class="tv-cerrado">GLI ORDINI PER OGGI SONO CHIUSI. QUESTO ORDINE È PER ${fechaLegible(FECHA)}.</div>` : ''}
      <div class="tv-card">
        <div class="tv-row">🥟<span>SCEGLI LE EMPANADAS CHE VUOI, <b>MINIMO ${CONFIG.minEmpanadas}</b>. CLASSICHE <b>${eur(CONFIG.precio.classica)}</b> · SPECIALI <b>${eur(CONFIG.precio.speciale)}</b></span></div>
        <div class="tv-row">🥤<span>PUOI AGGIUNGERE BIBITE E UN DOLCE</span></div>
        <div class="tv-row">⏰<span>ORDINI ENTRO LE <b>12:30</b> DI ${fechaLegible(FECHA)}</span></div>
        <div class="tv-row">🛵<span>CONSEGNA GRATUITA IN UFFICIO CON ALMENO <b>${CONFIG.minimoColleghi} COLLEGHI</b></span></div>
        <div class="tv-row">💳<span>PAGHI ONLINE CON CARTA O SATISPAY. <b>PRESTO ANCHE EDENRED: CI STIAMO LAVORANDO!</b></span></div>
      </div>`;
    barra('', "INIZIA L'ORDINE", true, false); return;
  }
  if(st.step===1){
    const c=cuentas();
    const lista = (arr,tipo)=>arr.slice().sort((a,b)=>a.it.name.localeCompare(b.it.name,'it')).map(s=>{
      const ok=saborDisponible(s), q=st.emp[s.key]||0;
      return `<div class="tv-item${ok?'':' off'}"><span class="nm">${s.it.name}<span class="ing">${s.it.ing||''}${s.it.all&&s.it.all.length?' ('+s.it.all.join(',')+')':''}</span></span>
        <span class="pr">${eur(CONFIG.precio[tipo])}</span>${ok?stepper('tvEmp',s.key,q):'<span class="pr">ESAURITA</span>'}</div>`;
    }).join('');
    SCR.innerHTML = `<h1>SCEGLI LE TUE EMPANADAS</h1><p class="sub">MINIMO ${CONFIG.minEmpanadas}</p>
      <div class="tv-grp">LE CLASSICHE</div>${lista(SABORES.classiche,'classica')}
      <div class="tv-grp">LE SPECIALI</div>${lista(SABORES.speciali,'speciale')}
      <div class="tv-legend">ALLERGENI: ${Object.entries(LEGENDA).map(([n,v])=>n+'.'+v).join(' · ')}</div>`;
    const falta = CONFIG.minEmpanadas - c.nE;
    barra(falta>0 ? `ANCORA ${falta} PER ARRIVARE AL MINIMO` : `${c.nE} EMPANADAS · ${eur(c.tot)}`, 'AVANTI', falta<=0, true); return;
  }
  if(st.step===2){
    SCR.innerHTML = `<h1>VUOI QUALCOSA DA BERE?</h1><p class="sub">FACOLTATIVO</p>
      ${BIBITE.map(b=>`<div class="tv-item"><span class="nm">${b.nome}</span><span class="pr">${eur(b.prezzo)}</span>${stepper('tvBib',b.key,st.bib[b.key]||0)}</div>`).join('')}`;
    const n=BIBITE.reduce((a,b)=>a+(st.bib[b.key]||0),0);
    barra(`TOTALE ${eur(cuentas().tot)}`, n? 'AVANTI' : 'NO, GRAZIE', true, true); return;
  }
  if(st.step===3){
    SCR.innerHTML = `<h1>E UN DOLCE PER FINIRE?</h1><p class="sub">FACOLTATIVO</p>
      <img class="tv-foto" src="${FOTO_ALFAJOR}" alt="Alfajores">
      <p class="sub" style="text-align:center">BISCOTTI CON DULCE DE LECHE, RICOPERTI DI CIOCCOLATO BIANCO O NERO</p>
      ${DOLCI.map(d=>`<div class="tv-item"><span class="nm">${d.nome}</span><span class="pr">${eur(d.prezzo)}</span>${stepper('tvDol',d.key,st.dol[d.key]||0)}</div>`).join('')}`;
    const n=DOLCI.reduce((a,d)=>a+(st.dol[d.key]||0),0);
    barra(`TOTALE ${eur(cuentas().tot)}`, n? 'AVANTI' : 'NO, GRAZIE', true, true); return;
  }
  if(st.step===4){
    const c=cuentas();
    const righe=[];
    todosSabores().forEach(s=>{ const q=st.emp[s.key]; if(q) righe.push([`${q}× ${s.it.name}`, q*CONFIG.precio[s.tipo]]); });
    BIBITE.forEach(b=>{ const q=st.bib[b.key]; if(q) righe.push([`${q}× ${b.nome}`, q*b.prezzo]); });
    DOLCI.forEach(d=>{ const q=st.dol[d.key]; if(q) righe.push([`${q}× ${d.nome}`, q*d.prezzo]); });
    SCR.innerHTML = `<h1>QUASI FATTO!</h1><p class="sub">I TUOI DATI</p>
      <div class="tv-lbl">NOME</div><input class="tv-input" id="fNome" value="${st.nome}" autocomplete="given-name">
      <div class="tv-lbl">COGNOME</div><input class="tv-input" id="fCognome" value="${st.cognome}" autocomplete="family-name">
      <div class="tv-lbl">TELEFONO</div><input class="tv-input" id="fTel" value="${st.tel}" inputmode="tel" placeholder="333 1234567">
      <div class="tv-err" id="fTelErr">NUMERO NON VALIDO</div>
      <div class="tv-card"><div class="tv-priv">DON SALO TORINO USA NOME, COGNOME E TELEFONO SOLO PER GESTIRE IL TUO ORDINE. LI CONSERVIAMO 90 GIORNI E PUOI CHIEDERCI DI CANCELLARLI QUANDO VUOI SCRIVENDOCI SU WHATSAPP.</div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;font-weight:800;"><input type="checkbox" id="fPriv" ${st.privacy?'checked':''}> HO LETTO E ACCETTO</label></div>
      <div class="tv-card tv-res">${righe.map(r=>`<div><span>${r[0]}</span><span>${eur(r[1])}</span></div>`).join('')}
        <div><span>CONSEGNA</span><span>GRATIS</span></div>
        <div class="tot"><span>TOTALE</span><span>${eur(c.tot)}</span></div></div>
      <div class="tv-entrega">🛵 ${entrega}</div>`;
    const upd=()=>{
      st.nome=document.getElementById('fNome').value.trim().toUpperCase();
      st.cognome=document.getElementById('fCognome').value.trim().toUpperCase();
      st.tel=document.getElementById('fTel').value.replace(/\s/g,'');
      st.privacy=document.getElementById('fPriv').checked;
      const telOk=/^\+?\d{9,13}$/.test(st.tel);
      document.getElementById('fTelErr').style.display = (st.tel && !telOk) ? 'block':'none';
      document.getElementById('tvNext').disabled = !(st.nome && st.cognome && telOk && st.privacy);
      guardar();
    };
    ['fNome','fCognome','fTel','fPriv'].forEach(id=>document.getElementById(id).addEventListener('input',upd));
    document.getElementById('fPriv').addEventListener('change',upd);
    barra(`TOTALE ${eur(c.tot)}`, 'VAI AL PAGAMENTO', false, true); upd(); return;
  }
  if(st.step===5){
    const c=cuentas();
    const cents=Math.round(c.tot*100);
    SCR.innerHTML = `<h1>PAGAMENTO</h1>
      <div class="tv-code"><div class="l">CODICE ORDINE</div><div class="c">${st.codigo}</div><button onclick="tvCopia()" id="btnCopia">📋 COPIA</button></div>
      <div class="tv-amount"><div class="l">IMPORTO DA PAGARE</div><div class="v">${eur(c.tot)}</div></div>
      <a class="tv-pay" href="${CONFIG.linkSatispay}?amount=${cents}" target="_blank" rel="noopener">PAGA CON SATISPAY<small>L'IMPORTO È GIÀ INSERITO · SCRIVI IL CODICE ${st.codigo} NELLA NOTA</small></a>
      <a class="tv-pay" href="${CONFIG.linkSumup}" target="_blank" rel="noopener">PAGA CON CARTA<small>INSERISCI ${eur(c.tot)} E IL CODICE ${st.codigo} NELLA NOTA</small></a>
      <p class="sub" style="text-align:center;margin-top:14px">QUANDO HAI PAGATO, TOCCA "HO PAGATO"</p>`;
    barra(`TOTALE ${eur(c.tot)}`, 'HO PAGATO', true, false); return;
  }
  if(st.step===6){
    const url = location.href.split('#')[0];
    const msg = encodeURIComponent(`🥟 Oggi Tavolo Empanadas con Don Salo! Ordina anche tu entro le 12:30: ${url}`);
    SCR.innerHTML = `<div class="tv-fatto"><div class="big">🎉</div><h1>ORDINE RICEVUTO!</h1>
      <p class="sub">GRAZIE ${st.nome}: LE TUE EMPANADAS ARRIVANO ${fechaLegible(FECHA)} TRA LE ${EMPRESA.franja.replace('-',' E LE ')}.</p>
      <div class="tv-entrega">🛵 ${EMPRESA.direccion}</div>
      <p class="sub" style="margin-top:14px">CODICE ORDINE <b>${st.codigo}</b></p>
      <a class="tv-pay" href="https://wa.me/?text=${msg}" target="_blank" rel="noopener">📲 FAI ORDINARE UN COLLEGA<small>CONDIVIDI IL LINK SU WHATSAPP</small></a></div>`;
    sinBarra(); return;
  }
}

// ── Acciones ──
window.tvEmp=(k,d)=>{ st.emp[k]=Math.max(0,(st.emp[k]||0)+d); if(!st.emp[k]) delete st.emp[k]; guardar(); render(); };
window.tvBib=(k,d)=>{ st.bib[k]=Math.max(0,(st.bib[k]||0)+d); if(!st.bib[k]) delete st.bib[k]; guardar(); render(); };
window.tvDol=(k,d)=>{ st.dol[k]=Math.max(0,(st.dol[k]||0)+d); if(!st.dol[k]) delete st.dol[k]; guardar(); render(); };
window.tvIndietro=()=>{ if(st.step>0 && st.step<5){ st.step--; guardar(); render(); } };
window.tvCopia=()=>{ navigator.clipboard && navigator.clipboard.writeText(st.codigo); const b=document.getElementById('btnCopia'); if(b) b.textContent='✓ COPIATO'; };
window.tvAvanti=async()=>{
  const btn=document.getElementById('tvNext');
  if(st.step<=3){ st.step++; guardar(); render(); return; }
  if(st.step===4){
    btn.disabled=true; btn.textContent='UN MOMENTO…';
    try{ await crearPedido(); st.step=5; guardar(); render(); }
    catch(e){ console.error(e); alert("NON SIAMO RIUSCITI A REGISTRARE L'ORDINE. RIPROVA."); render(); }
    return;
  }
  if(st.step===5){
    btn.disabled=true; btn.textContent='UN MOMENTO…';
    try{ await avisarPago(); st.step=6; guardar(); render(); }
    catch(e){ console.error(e); alert('RIPROVA TRA UN MOMENTO.'); render(); }
  }
};

// Código T-0001, T-0002… con el mismo mecanismo que el delivery
async function nuevoCodigo(){
  try{
    const n = await runTransaction(db, async tx=>{
      const ref=doc(db,'config','contadorTavolo'); const s=await tx.get(ref);
      const v=(s.exists()?(s.data().n||0):0)+1; tx.set(ref,{n:v}); return v;
    });
    return 'T-'+String(n).padStart(4,'0');
  }catch(e){ console.error('codigo',e); return 'T-X'+String(Date.now()).slice(-5); }
}
async function crearPedido(){
  if(st.codigo && st.fecha===FECHA) return;     // ya creado (volvió a la página)
  const c=cuentas();
  const empanadas={}; todosSabores().forEach(s=>{ if(st.emp[s.key]) empanadas[nombreInterno(s.key)]=st.emp[s.key]; });
  st.codigo = await nuevoCodigo();
  st.fecha = FECHA;
  await setDoc(doc(db,'tavolo_pedidos',st.codigo), {
    codigo: st.codigo, empresa: SLUG, fecha: FECHA,
    nome: st.nome, cognome: st.cognome, phone: st.tel,
    empanadas, bibite: {...st.bib}, dolci: {...st.dol},
    total: c.tot, estado: 'esperando_pago', creadoMs: Date.now()
  });
  st.estado='esperando_pago';
}
async function avisarPago(){
  await updateDoc(doc(db,'tavolo_pedidos',st.codigo), { estado:'pago_avisado', avisadoMs: Date.now() });
  // Suma un colega a la mesa (en la parte 2 lo hará el servidor al confirmarse el pago)
  const ref=doc(db,'tavolo_contador', SLUG+'_'+FECHA);
  await runTransaction(db, async tx=>{
    const s=await tx.get(ref); const v=(s.exists()?(s.data().pagati||0):0)+1;
    tx.set(ref,{ pagati:v, empresa:SLUG, fecha:FECHA });
  });
  st.estado='pago_avisado';
}

// ── Arranque ──
(async()=>{
  if(!SLUG){ render(); return; }
  try{
    const sn=await getDoc(doc(db,'tavolo_empresas',SLUG));
    if(sn.exists() && sn.data().activa!==false){
      EMPRESA=sn.data(); EMPRESA.dia=Number(EMPRESA.dia);
      FECHA=proximaEntrega(EMPRESA.dia);
    }
  }catch(e){ console.error('empresa',e); }
  if(EMPRESA && FECHA){
    // Un pedido viejo (de otra entrega) se descarta y se empieza de cero
    if(st.fecha && st.fecha!==FECHA){ st={ step:0, emp:{}, bib:{}, dol:{}, nome:st.nome, cognome:st.cognome, tel:st.tel, privacy:false, codigo:null, estado:null, fecha:null }; guardar(); }
    escucharContador();
    onSnapshot(doc(db,'config','disponibilidad'), s=>{ DISP=s.exists()?s.data():{}; if(st.step===1) render(); });
  } else { EMPRESA=null; }
  render();
})();
</script>
