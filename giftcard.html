<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gift Card · Don Salo Torino</title>
<meta name="description" content="Regala Don Salo: la gift card per empanadas e prodotti nel locale di Torino.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Merriweather:wght@700;900&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F0DF; --ink:#191512; --ink-soft:#55504A; --accent:#C1502E; --accent-dark:#9C3E22;
    --success:#4F7942; --success-bg:#E4EDE0; --error:#B23A2E; --error-bg:#F6E3E0;
    --border:#E3DCCF; --radius:14px; --radius-sm:8px;
    --font-display:'League Spartan', system-ui, sans-serif;
    --font-serif:'Merriweather', Georgia, serif;
    --font-hk:'Hanken Grotesk', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font-hk); -webkit-font-smoothing:antialiased; }
  button{ text-transform:uppercase; }
  .gc{ max-width:480px; margin:0 auto; padding:16px 18px 130px; }
  .gc-brand{ text-align:center; margin:8px 0 4px; }
  .gc-brand img{ width:96px; height:auto; }
  .gc-brand .t1{ font-family:var(--font-serif); font-weight:900; font-size:26px; letter-spacing:1px; margin-top:2px; }
  .gc-brand .t2{ font-size:12px; letter-spacing:5px; color:var(--ink-soft); margin-top:2px; }
  .gc-dots{ display:flex; justify-content:center; gap:7px; margin:12px 0 2px; }
  .gc-dots i{ width:8px; height:8px; border-radius:5px; background:var(--border); }
  .gc-dots i.on{ width:22px; background:var(--accent); }
  .gc-dots i.ok{ background:var(--accent-dark); }
  .gc h1{ font-family:var(--font-display); font-size:27px; line-height:1.1; margin:18px 0 6px; text-transform:uppercase; }
  .gc h1.centro{ text-align:center; }
  .gc .sub{ font-size:13px; color:var(--ink-soft); text-transform:uppercase; margin:0 0 14px; line-height:1.45; }
  .gc-card{ background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); padding:12px 16px; margin:12px 0; }
  .gc-row{ display:flex; gap:10px; font-size:13px; line-height:1.45; padding:7px 0; border-top:1px solid #F0EADF; text-transform:uppercase; }
  .gc-row:first-child{ border-top:none; }
  .gc-prev{ width:100%; height:auto; aspect-ratio:1200/750; display:block; border-radius:12px; box-shadow:0 8px 24px rgba(25,21,18,.18); background:#E9E0CC; }
  .gc-lbl{ font-size:11px; font-weight:800; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; margin-top:14px; }
  .gc-input{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); margin:5px 0 4px; background:#fff; text-transform:uppercase; color:var(--ink); }
  textarea.gc-input{ resize:none; min-height:70px; text-transform:none; }
  .gc-input:focus{ outline:none; border-color:var(--accent); }
  .gc-cont{ font-size:10.5px; color:var(--ink-soft); text-align:right; }
  .gc-err{ color:var(--error); font-size:12px; font-weight:700; margin:2px 0 6px; display:none; text-transform:uppercase; }
  .gc-dis{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:6px 0 4px; }
  .gc-dis button{ padding:0; border:2.5px solid transparent; border-radius:9px; background:none; cursor:pointer; overflow:hidden; line-height:0; }
  .gc-dis button img{ width:100%; aspect-ratio:1200/750; object-fit:cover; display:block; border-radius:6px; background:#E9E0CC; }
  .gc-dis button.on{ border-color:var(--ink); }
  .gc-dis-nom{ font-size:11px; font-weight:800; letter-spacing:1px; text-align:center; text-transform:uppercase; color:var(--ink-soft); }
  .gc-imp{ display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); padding:6px 16px; margin:6px 0; }
  .gc-imp:focus-within{ border-color:var(--accent); }
  .gc-imp span{ font-family:var(--font-display); font-size:34px; font-weight:700; }
  .gc-imp input{ flex:1; min-width:0; border:none; outline:none; font-family:var(--font-display); font-size:38px; font-weight:700; background:transparent; color:var(--ink); padding:6px 0; }
  .gc-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .gc-chips button{ flex:1; border:1.5px solid var(--border); background:#fff; border-radius:999px; padding:9px 0; font:inherit; font-size:14px; font-weight:800; cursor:pointer; color:var(--ink); }
  .gc-chips button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .gc-msgs{ display:flex; flex-direction:column; gap:7px; margin:6px 0 4px; }
  .gc-msgs button{ text-align:left; text-transform:none; border:1.5px solid var(--border); background:#fff; border-radius:var(--radius-sm); padding:11px 14px; font:inherit; font-size:14px; font-style:italic; color:var(--ink); cursor:pointer; }
  .gc-msgs button.on{ border-color:var(--ink); background:var(--ink); color:#fff; }
  .gc-msgs button.esp{ font-style:normal; font-weight:800; font-size:12.5px; letter-spacing:.5px; text-transform:uppercase; }
  .gc-priv{ font-size:11.5px; color:var(--ink-soft); line-height:1.45; text-transform:uppercase; }
  .gc-check{ display:flex; gap:9px; align-items:center; margin-top:10px; font-size:12px; font-weight:800; text-transform:uppercase; }
  .gc-check input{ width:20px; height:20px; accent-color:var(--accent); }
  .gc-code{ background:var(--ink); color:#fff; border-radius:var(--radius); padding:16px; text-align:center; }
  .gc-code .l{ font-size:11px; letter-spacing:2px; opacity:.7; text-transform:uppercase; }
  .gc-code .c{ font-family:var(--font-display); font-size:38px; font-weight:700; letter-spacing:2px; }
  .gc-code button{ margin-top:4px; background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.5); border-radius:999px; padding:6px 14px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
  .gc-amount{ text-align:center; margin:14px 0 8px; }
  .gc-amount .l{ font-size:11px; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; }
  .gc-amount .v{ font-family:var(--font-display); font-size:40px; font-weight:700; }
  .gc-pay{ display:block; width:100%; text-decoration:none; text-align:center; background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); padding:14px; margin:8px 0; color:var(--ink); font:inherit; font-weight:800; text-transform:uppercase; cursor:pointer; }
  .gc-pay small{ display:block; font-weight:500; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .gc-pay.tocado{ border-color:var(--success); }
  .gc-pay.prim{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .gc-pay.prim small{ color:rgba(255,255,255,.85); }
  .gc-ok{ background:var(--success-bg); color:var(--success); font-weight:800; font-size:13px; border-radius:var(--radius-sm); padding:10px 12px; text-transform:uppercase; line-height:1.45; }
  .gc-warn{ background:var(--error-bg); color:var(--accent-dark); font-weight:800; font-size:13px; border-radius:var(--radius-sm); padding:10px 12px; text-transform:uppercase; line-height:1.45; }
  .gc-saldo{ display:flex; justify-content:space-between; align-items:flex-end; margin:14px 2px 4px; }
  .gc-saldo .l{ font-size:11px; font-weight:800; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; }
  .gc-saldo .v{ font-family:var(--font-display); font-size:38px; font-weight:700; line-height:1; }
  .gc-saldo .r{ text-align:right; font-size:12px; color:var(--ink-soft); text-transform:uppercase; line-height:1.5; }
  .gc-bar{ height:8px; border-radius:4px; background:var(--border); overflow:hidden; margin:6px 2px 12px; }
  .gc-bar i{ display:block; height:100%; background:var(--success); }
  .gc-spin{ width:42px; height:42px; border-radius:50%; border:4px solid var(--border); border-top-color:var(--accent); margin:18px auto 6px; animation:gcgira 1s linear infinite; }
  @keyframes gcgira{ to{ transform:rotate(360deg); } }
  .gc-link{ display:block; text-align:center; font-size:12px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; margin:16px 0 0; background:none; border:none; width:100%; cursor:pointer; text-decoration:underline; font-family:inherit; }
  .gc-fbar{ position:fixed; left:0; right:0; bottom:0; padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)); background:var(--bg); border-top:1px solid var(--border); z-index:30; }
  .gc-fbar .in{ max-width:480px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .gc-fbar .info{ flex:1; font-size:12px; font-weight:800; text-transform:uppercase; color:var(--ink-soft); }
  .gc-fbar .in.centro{ justify-content:center; }
  .gc-fbar .in.centro .info{ display:none; }
  .gc-btn{ border:none; border-radius:999px; padding:14px 22px; font:inherit; font-size:14px; font-weight:800; letter-spacing:.5px; background:var(--accent); color:#fff; cursor:pointer; }
  .gc-btn.sec{ background:#fff; color:var(--ink); border:1.5px solid var(--border); padding:14px 17px; }
  .gc-btn:disabled{ background:#D8CDBF; cursor:not-allowed; }
  .gc-hidden{ display:none !important; }
  .gc-pie{ font-size:10.5px; color:var(--ink-soft); text-align:center; text-transform:uppercase; line-height:1.6; margin-top:22px; }
</style>
</head>

// ── Barra de abajo ──
function barra(info, txt, ok, conBack){
  document.getElementById('gcBar').classList.remove('gc-hidden');
  document.getElementById('gcBarInfo').innerHTML = info||'';
  const b = document.getElementById('gcNext'); b.textContent = txt; b.disabled = !ok;

let MINI = null;   // data URL de cada diseño, se dibujan una sola vez
async function miniaturas(){
  if(MINI) return MINI;
  const c = document.createElement('canvas'); MINI = {};
  for(const d of G.DISENOS){
    await G.dibujar(c, { diseno:d.id, importe: importeValido() ? st.importe : 0 });

  }
  return MINI;
}
let previaPendiente = null;
function previa(){
  const cv = document.getElementById('gcPrev'); if(!cv) return;
  // si se escribe rápido, se dibuja solo la última versión
  clearTimeout(previaPendiente);

      <div class="gc-dis-nom" id="gcDisNom">${G.DISENOS.find(d=>d.id===st.diseno).nombre}</div>
      <div class="gc-lbl">L'IMPORTO</div>
      <div class="gc-imp"><span>€</span><input id="fImp" inputmode="decimal" autocomplete="off" placeholder="0" value="${st.importe!=null?String(st.importe).replace('.',','):''}"></div>
      <div class="gc-err" id="fImpErr">DA € ${CONFIG.minimo} A € ${CONFIG.maximo}</div>
      <div class="gc-chips">${CONFIG.sugeridos.map(n=>`<button class="${st.importe===n?'on':''}" onclick="gcSugerido(${n})">€ ${n}</button>`).join('')}</div>`;
    previa();
    miniaturas().then(m=>{ document.querySelectorAll('#gcDis img').forEach((im,i)=>{ im.src = m[G.DISENOS[i].id]; }); });
    const inp = document.getElementById('fImp');
    inp.addEventListener('input', ()=>{
      const t = inp.value.replace(/[^0-9,\.]/g,'').replace(',', '.');
      const n = parseFloat(t);
      st.importe = isFinite(n) ? Math.round(n*100)/100 : null;
      document.getElementById('fImpErr').style.display = (inp.value && !importeValido()) ? 'block' : 'none';
      document.querySelectorAll('.gc-chips button').forEach((b,i)=>b.classList.toggle('on', st.importe===CONFIG.sugeridos[i]));
      guardar(); previa(); pintarBarra1();
    });
    pintarBarra1(); return;
  }
  if(st.step === 2){
    SCR.innerHTML = `${puntos(2)}
      <h1>PER CHI È?</h1>
      <canvas class="gc-prev" id="gcPrev"></canvas>
      <div class="gc-lbl">PER</div><input class="gc-input" id="fPara" maxlength="30" value="${esc(st.para)}" placeholder="NOME DI CHI LA RICEVE">
      <div class="gc-lbl">DA</div><input class="gc-input" id="fDe" maxlength="30" value="${esc(st.de)}" placeholder="IL TUO NOME O &quot;TUTTI NOI&quot;">
      <div class="gc-lbl">UN MESSAGGIO SULLA GIFT CARD</div>
      <div class="gc-msgs" id="gcMsgs">
        ${CONFIG.mensajes.map((m,i)=>`<button type="button" data-sel="${i}" onclick="gcMensaje('${i}')">“${esc(m)}”</button>`).join('')}
        <button type="button" class="esp" data-sel="ninguno" onclick="gcMensaje('ninguno')">NESSUN MESSAGGIO</button>
        <button type="button" class="esp" data-sel="propio" onclick="gcMensaje('propio')">✏️ VUOI LASCIARE IL TUO MESSAGGIO?</button>
      </div>
      <div id="fMsgBox" class="${st.msgSel==='propio'?'':'gc-hidden'}">
        <textarea class="gc-input" id="fMsg" maxlength="90" placeholder="Scrivi qui il tuo messaggio…">${st.msgSel==='propio'?esc(st.mensaje):''}</textarea>
        <div class="gc-cont" id="fMsgCont"></div>
      </div>
      <h1 style="font-size:20px;margin-top:22px">I TUOI DATI</h1>
      <p class="sub">SOLO PER CONTATTARTI SE C'È UN PROBLEMA CON IL PAGAMENTO</p>
      <div class="gc-lbl">NOME E COGNOME</div><input class="gc-input" id="fNome" maxlength="60" value="${esc(st.nome)}" autocomplete="name">
      <div class="gc-lbl">TELEFONO</div><input class="gc-input" id="fTel" maxlength="20" value="${esc(st.tel)}" inputmode="tel" placeholder="333 1234567" autocomplete="tel">
      <div class="gc-err" id="fTelErr">NUMERO NON VALIDO</div>
      <div class="gc-card"><div class="gc-priv">DON SALO TORINO USA NOME E TELEFONO SOLO PER GESTIRE QUESTO ACQUISTO. LI CONSERVIAMO FINO ALLA SCADENZA DELLA GIFT CARD E PUOI CHIEDERCI DI CANCELLARLI QUANDO VUOI SCRIVENDOCI SU WHATSAPP.</div>
        <label class="gc-check"><input type="checkbox" id="fPriv" ${st.privacy?'checked':''}> HO LETTO E ACCETTO</label></div>`;
    previa();
    const upd = ()=>{
      st.para = document.getElementById('fPara').value.toUpperCase().slice(0,30);
      st.de = document.getElementById('fDe').value.toUpperCase().slice(0,30);
      st.mensaje = mensajeElegido();
      st.nome = document.getElementById('fNome').value.trim().toUpperCase().slice(0,60);
      st.tel = document.getElementById('fTel').value.replace(/[\s\-\.\/]/g,'').slice(0,20);
      st.privacy = document.getElementById('fPriv').checked;
      const telOk = /^\+?\d{9,13}$/.test(st.tel);
      document.getElementById('fTelErr').style.display = (st.tel && !telOk) ? 'block' : 'none';
      document.getElementById('fMsgCont').textContent = st.msgSel==='propio' && st.mensaje ? `${st.mensaje.length}/90` : '';
      document.querySelectorAll('#gcMsgs button').forEach(b=>b.classList.toggle('on', b.dataset.sel===String(st.msgSel)));
      document.getElementById('gcNext').disabled = !(st.para.trim() && st.de.trim() && st.nome && telOk && st.privacy);
      guardar(); previa();
    };
    ['fPara','fDe','fMsg','fNome','fTel'].forEach(id=>document.getElementById(id).addEventListener('input', upd));
    gcUpdDatos = upd;
    document.getElementById('fPriv').addEventListener('change', upd);
    barra(`GIFT CARD ${eur(st.importe)}`, 'VAI AL PAGAMENTO', false, true); upd(); return;
  }
  if(st.step === 3){
    const cents = Math.round(st.importe*100);
    SCR.innerHTML = `${puntos(3)}
      <h1>PAGAMENTO</h1>
      <div class="gc-code"><div class="l">IL TUO RIFERIMENTO</div><div class="c">${esc(st.ref)}</div><button onclick="gcCopia()" id="btnCopia">📋 COPIA</button></div>
      <div class="gc-amount"><div class="l">IMPORTO DA PAGARE</div><div class="v">${eur(st.importe)}</div></div>
      <a class="gc-pay${st.pagoTocado?' tocado':''}" href="${CONFIG.linkSatispay}?amount=${cents}" target="_blank" rel="noopener" onclick="gcPagoTocado()">PAGA CON SATISPAY<small>L'IMPORTO È GIÀ INSERITO · SCRIVI ${esc(st.ref)} NEL MESSAGGIO</small></a>
      <a class="gc-pay${st.pagoTocado?' tocado':''}" href="${CONFIG.linkSumup}" target="_blank" rel="noopener" onclick="gcPagoTocado()">PAGA CON CARTA<small>INSERISCI ${eur(st.importe)} E SCRIVI ${esc(st.ref)} NELLA NOTA</small></a>
      <p class="sub" style="text-align:center;margin-top:14px">QUANDO HAI PAGATO, TORNA QUI E TOCCA "HO PAGATO"</p>
      <button class="gc-link" onclick="gcRicomincia()">ANNULLA E RICOMINCIA</button>`;
    barra(st.pagoTocado ? `GIFT CARD ${eur(st.importe)}` : 'PRIMA SCEGLI COME PAGARE', 'HO PAGATO', st.pagoTocado, false); return;
  }
  if(st.step === 4){ sinBarra(); seguirTarjeta(); return; }
}
let gcUpdDatos = null;
function mensajeElegido(){
  if(st.msgSel === 'propio'){ const t = document.getElementById('fMsg'); return t ? t.value.replace(/\s+/g,' ').slice(0,90) : st.mensaje; }
  const i = Number(st.msgSel);
  return Number.isInteger(i) && CONFIG.mensajes[i] ? CONFIG.mensajes[i] : '';
}
window.gcMensaje = sel => {
  st.msgSel = sel;
  const box = document.getElementById('fMsgBox');
  box.classList.toggle('gc-hidden', sel !== 'propio');
  if(sel === 'propio'){ const t = document.getElementById('fMsg'); t.focus(); }
  if(gcUpdDatos) gcUpdDatos();
};
function pintarBarra1(){
  const ok = importeValido();
  barra(ok ? `GIFT CARD ${eur(st.importe)}` : `SCRIVI L'IMPORTO (MIN € ${CONFIG.minimo})`, 'AVANTI', ok, true);
}

// ── Acciones ──
window.gcDiseno = id => {
  st.diseno = id; guardar();
  document.querySelectorAll('#gcDis button').forEach((b,i)=>b.classList.toggle('on', G.DISENOS[i].id===id));
  document.getElementById('gcDisNom').textContent = G.DISENOS.find(d=>d.id===id).nombre;
  previa();
};
window.gcSugerido = n => {
  st.importe = n; guardar();
  const inp = document.getElementById('fImp'); if(inp) inp.value = String(n);
  document.getElementById('fImpErr').style.display = 'none';
  document.querySelectorAll('.gc-chips button').forEach((b,i)=>b.classList.toggle('on', CONFIG.sugeridos[i]===n));
  previa(); pintarBarra1();
};
window.gcIndietro = () => { if(st.step>0 && st.step<3){ st.step--; guardar(); render(); } };
window.gcPagoTocado = () => {
  st.pagoTocado = true; guardar();
  // la barra se habilita sin redibujar, así el link se abre normalmente
  setTimeout(()=>{ if(st.step===3){ barra(`GIFT CARD ${eur(st.importe)}`, 'HO PAGATO', true, false); document.querySelectorAll('.gc-pay').forEach(a=>a.classList.add('tocado')); } }, 50);
};
window.gcCopia = () => { try{ navigator.clipboard.writeText(st.ref); }catch(e){} const b=document.getElementById('btnCopia'); if(b) b.textContent='✓ COPIATO'; };
window.gcRicomincia = () => {
  if(!confirm('VUOI ANNULLARE QUESTA GIFT CARD E RICOMINCIARE?')) return;
  const keep = { nome:st.nome, tel:st.tel };
  st = Object.assign(NUEVO(), keep); guardar(); render();
};
window.gcNuova = () => { const keep = { nome:st.nome, tel:st.tel }; st = Object.assign(NUEVO(), keep); st.step = 1; guardar(); history.replaceState(null,'',location.pathname); render(); };
window.gcAvanti = async () => {
  const btn = document.getElementById('gcNext');
  if(st.step <= 1){ st.step++; guardar(); render(); return; }
  if(st.step === 2){
    btn.disabled = true; btn.textContent = 'UN MOMENTO…';
    try{ await crearGiftcard(); st.step = 3; guardar(); render(); }
    catch(e){ console.error(e); alert('NON SIAMO RIUSCITI A REGISTRARE LA GIFT CARD. RIPROVA.'); render(); }
    return;
  }
  if(st.step === 3){
    btn.disabled = true; btn.textContent = 'UN MOMENTO…';
    try{ await avisarPago(); st.step = 4; guardar(); render(); }
    catch(e){ console.error(e); alert('RIPROVA TRA UN MOMENTO.'); render(); }
  }
};

// Referencia corta para la nota del pago: G-0001, G-0002… (el código de la
// gift card no se usa como referencia: es lo que vale plata)
async function nuevaRef(){
  try{
    const n = await runTransaction(db, async tx=>{
      const ref = doc(db,'config','contadorGift'); const s = await tx.get(ref);
      const v = (s.exists() ? (s.data().n||0) : 0) + 1; tx.set(ref, { n:v }); return v;
    });
    return 'G-' + String(n).padStart(4,'0');
  }catch(e){ console.error('ref', e); return 'G-X' + String(Date.now()).slice(-5); }
}
async function crearGiftcard(){
  if(st.codigo) return;                  // ya creada (volvió a la página)
  const ref = await nuevaRef();
  const ahora = Date.now();
  // Se crea con un código nuevo; si justo existiera (imposible en la práctica),
  // la regla de Firestore rechaza la creación y se prueba con otro.
  let codigo = null, ultimoError = null;
  for(let i = 0; i < 3 && !codigo; i++){
    const c = G.nuevo();
    try{
      await setDoc(doc(db,'giftcards',c), {
        codigo: c, ref, estado: 'pendiente', origen: 'web',
        importePedido: st.importe, importe: 0, saldo: 0,
        diseno: st.diseno, para: st.para.trim(), de: st.de.trim(), mensaje: st.mensaje.trim(),
        creadoMs: ahora, pagoAvisado: false
      });
      codigo = c;
    }catch(e){ ultimoError = e; }
  }
  if(!codigo) throw ultimoError || new Error('sin código');
  // Datos del que compra: aparte, solo se leen con la sesión del mostrador
  try{
    await setDoc(doc(db,'giftcards_privado',codigo), { ref, nome: st.nome, tel: st.tel, privacy: true, creadoMs: ahora });
  }catch(e){ console.error('privado', e); }
  st.codigo = codigo; st.ref = ref;
}
async function avisarPago(){
  if(st.avisado) return;
  await updateDoc(doc(db,'giftcards',st.codigo), { pagoAvisado: true, avisadoMs: Date.now() });
  st.avisado = true;
}

// ═══ LA GIFT CARD (después de pagar, o abierta desde el QR) ═══
let escucha = null, CARD = null;
function seguirTarjeta(){
  if(escucha) return;
  SCR.innerHTML = `${puntos(4)}<div class="gc-spin"></div>`;
  escucha = onSnapshot(doc(db,'giftcards',st.codigo), sn=>{
    CARD = sn.exists() ? sn.data() : null;
    pintarTarjeta(true);
  }, e=>{ console.error(e); SCR.innerHTML = `<div class="gc-warn" style="margin-top:20px">NON RIUSCIAMO A LEGGERE LA GIFT CARD. CONTROLLA LA CONNESSIONE E RICARICA LA PAGINA.</div>`; });
}
function waLink(txt){ return `https://wa.me/${CONFIG.waLocal}?text=${encodeURIComponent(txt)}`; }

async function pintarTarjeta(esCompra){
  const c = CARD;
  const top = esCompra ? puntos(4) : '';
  if(!c){
    SCR.innerHTML = `${top}<h1 class="centro">GIFT CARD NON TROVATA</h1><p class="sub" style="text-align:center">CONTROLLA IL CODICE O SCRIVICI SU WHATSAPP.</p>
      <a class="gc-pay" href="${waLink('Ciao! Ho un problema con una gift card')}" target="_blank" rel="noopener">💬 SCRIVICI</a>`;
    return;
  }
  const ahora = Date.now();
  if(c.estado === 'pendiente'){
    SCR.innerHTML = `${top}
      <div class="gc-spin"></div>
      <h1 class="centro">STIAMO CONTROLLANDO IL PAGAMENTO</h1>
      <p class="sub" style="text-align:center">DI SOLITO CI VUOLE POCO, NEGLI ORARI DEL LOCALE. LA GIFT CARD APPARE QUI DA SOLA: PUOI ANCHE CHIUDERE LA PAGINA E RIAPRIRLA DOPO.</p>
      <div class="gc-card"><div class="gc-row">🧾<span>RIFERIMENTO <b>${esc(c.ref||st.ref)}</b></span></div>
        <div class="gc-row">💶<span>IMPORTO <b>${eur(c.importePedido)}</b></span></div></div>
      <a class="gc-pay" href="${waLink('Ciao! Ho pagato la gift card '+(c.ref||st.ref||''))}" target="_blank" rel="noopener">💬 HAI BISOGNO? SCRIVICI<small>WHATSAPP</small></a>`;
    return;
  }
  if(c.estado === 'rechazada'){
    SCR.innerHTML = `${top}<h1 class="centro">PAGAMENTO NON TROVATO</h1>
      <div class="gc-warn">NON ABBIAMO TROVATO IL PAGAMENTO PER ${esc(c.ref||'')}. SE HAI PAGATO, SCRIVICI E LO RISOLVIAMO SUBITO.</div>
      <a class="gc-pay" href="${waLink('Ciao! Ho pagato la gift card '+(c.ref||''))}" target="_blank" rel="noopener">💬 SCRIVICI SU WHATSAPP</a>
      ${esCompra ? `<button class="gc-link" onclick="gcNuova()">CREA UNA NUOVA GIFT CARD</button>` : ''}`;
    return;
  }
  // activa, agotada, anulada o vencida: se muestra la tarjeta
  const vencida = c.estado === 'activa' && c.venceMs && c.venceMs < ahora;
  let aviso = '';
  if(c.estado === 'anulada') aviso = `<div class="gc-warn">QUESTA GIFT CARD NON È PIÙ VALIDA.</div>`;
  else if(c.estado === 'agotada' || (c.saldo||0) <= 0) aviso = `<div class="gc-warn">GIFT CARD UTILIZZATA PER INTERO. GRAZIE!</div>`;
  else if(vencida) aviso = `<div class="gc-warn">GIFT CARD SCADUTA IL ${G.fecha(c.venceMs)}.</div>`;
  const usable = !aviso;
  const pct = c.importe > 0 ? Math.max(0, Math.min(100, (c.saldo||0) / c.importe * 100)) : 0;
  SCR.innerHTML = `${top}
    ${esCompra && usable ? `<h1 class="centro">🎉 LA TUA GIFT CARD È PRONTA!</h1>` : `<h1 class="centro">LA TUA GIFT CARD</h1>`}
    <canvas class="gc-prev" id="gcCard"></canvas>
    ${aviso}
    <div class="gc-saldo"><div><div class="l">SALDO DISPONIBILE</div><div class="v">${eur(usable ? c.saldo : 0)}</div></div>
      <div class="r">DI ${eur(c.importe)}<br>${c.venceMs ? 'VALIDA FINO AL '+G.fecha(c.venceMs) : ''}</div></div>
    <div class="gc-bar"><i style="width:${usable?pct:0}%"></i></div>
    ${usable ? `
      <button class="gc-pay prim" onclick="gcCondividi()">📲 INVIALA<small>WHATSAPP, MESSAGGI, EMAIL…</small></button>
      <button class="gc-pay" onclick="gcScarica()">⬇️ SCARICA L'IMMAGINE</button>
      <button class="gc-pay" onclick="gcCopiaLink()" id="btnLink">🔗 COPIA IL LINK</button>
      <div class="gc-card"><div class="gc-row">🥟<span>SI USA NEL LOCALE DON SALO TORINO: MOSTRA IL QR O IL CODICE IN CASSA</span></div>
        <div class="gc-row">🔁<span>PUOI USARLA IN PIÙ VOLTE FINO A ESAURIRE IL SALDO</span></div>
        <div class="gc-row">🔒<span>IL CODICE VALE COME DENARO: MANDALO SOLO A CHI LA REGALI</span></div></div>` : ''}
    ${esCompra ? `<button class="gc-link" onclick="gcNuova()">CREA UN'ALTRA GIFT CARD</button>` : `<a class="gc-link" href="${location.pathname}">🎁 REGALANE UNA ANCHE TU</a>`}
    <div class="gc-pie">DON SALO TORINO · NON CONVERTIBILE IN DENARO</div>`;
  await G.dibujar(document.getElementById('gcCard'), datosTarjeta(c));
}
function datosTarjeta(c){
  return { diseno:c.diseno, importe:c.importe, para:c.para, de:c.de, mensaje:c.mensaje,
           codigo:c.codigo, vence:c.venceMs, url:linkTarjeta(c.codigo) };
}
async function imagen(){
  const cv = document.createElement('canvas');
  await G.dibujar(cv, datosTarjeta(CARD));
  return G.aBlob(cv);
}
const nombreArchivo = () => 'giftcard-don-salo-' + String(CARD.para||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.png';
const textoRegalo = () => `🎁 Una gift card Don Salo per te${CARD.para?', '+CARD.para:''}! ${CARD.mensaje?'“'+CARD.mensaje+'” ':''}La usi per empanadas e prodotti nel locale di Torino. Saldo e QR qui: ${linkTarjeta(CARD.codigo)}`;
window.gcCondividi = async () => {
  try{
    const blob = await imagen();
    const file = new File([blob], nombreArchivo(), { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], text: textoRegalo() });
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; console.error(e); }
  // sin compartir con archivo (por ejemplo en la PC): WhatsApp con el link
  window.open('https://wa.me/?text=' + encodeURIComponent(textoRegalo()), '_blank');
};
window.gcScarica = async () => {
  const blob = await imagen();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombreArchivo();
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
};
window.gcCopiaLink = () => {
  try{ navigator.clipboard.writeText(linkTarjeta(CARD.codigo)); }catch(e){}
  const b = document.getElementById('btnLink'); if(b) b.textContent = '✓ LINK COPIATO';
};

// ═══ ARRANQUE ═══
(async()=>{
  const q = new URLSearchParams(location.search).get('c');
  if(q){
    // Vista de una gift card desde el QR o el link
    sinBarra();
    const cod = G.normalizar(q);
    if(!G.valido(cod)){ CARD = null; pintarTarjeta(false); return; }
    SCR.innerHTML = `<div class="gc-spin"></div>`;
    // si es la que compró este mismo teléfono, se sigue en vivo (pasa de pendiente a activa sola)
    if(st.codigo === cod){ st.step = 4; guardar(); seguirTarjeta(); return; }
    try{ const sn = await getDoc(doc(db,'giftcards',cod)); CARD = sn.exists() ? sn.data() : null; }
    catch(e){ console.error(e); CARD = null; }
    pintarTarjeta(false); return;
  }
  if(st.step >= 3 && !st.codigo) st.step = 2;   // estado roto: vuelve a los datos
  render();
})();
</script>
</body>
</html>
